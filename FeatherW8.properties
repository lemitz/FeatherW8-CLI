# FeatherW8 settings. Edit this file beside FeatherW8.exe, then restart the player.
# language: auto (Windows UI language), en, or ru
language=auto

# audio.output: auto, asio, wasapi-exclusive, or shared
# auto prefers FiiO ASIO for FiiO/K11 when its driver is available;
# otherwise it tries WASAPI Exclusive. Shared is offered only if strict output fails.
audio.output=auto

# dsd.mode: auto, native, or dop (DSD files: .dsf, .dff)
# auto plays DSD natively through an ASIO driver that supports it (e.g. FiiO ASIO) and falls
# back to DoP (DSD packed into 24-bit PCM) over ASIO or WASAPI Exclusive. native / dop force one path.
# DSD is never played through WASAPI Shared.
dsd.mode=auto

# ui.color: on or off
# on colours the output line: green = ASIO, cyan = WASAPI Exclusive (both bit-perfect),
# red = WASAPI Shared (NOT bit-perfect); warnings are gold, errors red. NO_COLOR also turns it off.
ui.color=on
